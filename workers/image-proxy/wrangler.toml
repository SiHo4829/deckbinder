# DeckBinder 카드 이미지 리버스 프록시 (plan §3.5 · 결정문 §9.4 ⓖ)
#
# ★★★ 2026-09-01 — 이 머리말이 한 번 바뀌었다. 무엇이 바뀌었는지가 중요하다.
#
#    ~~"이 파일은 아직 배포할 수 없다"~~ → 🚨 **이제 기술적으로는 배포된다.**
#    KV id가 채워졌고(같은 날 만들었다) 설정은 유효하다.
#
#    ⚠️ **그러니 남은 것은 기술적 잠금이 아니라 사람의 승인 하나뿐이다.**
#    둘은 다르고, 그 차이를 흐리지 않으려고 이 문단을 고쳐 적는다 —
#    "아직 못 한다"와 "아직 하면 안 된다"는 다른 문장이다.
#
# 🚨 **배포 전에 받아야 하는 것: 사람 확인 지점 ②** (사용자 일감 9 ·
#    §9.4 ⓖ-7) — ⓐ 상시 운영을 켤 것인가 ⓑ 원천 요청 시간당 상한
#    ⓒ 자동 중단 규칙. **셋을 다 받기 전에 `wrangler deploy`를 치지 않는다.**
#    이것이 이 프로젝트에서 "N회 승인"이 "상시 승인"으로 바뀌는 첫 자리다.
#
# ✅ 안전장치 하나는 코드가 진다: **시크릿 `IMAGE_PROXY_IP_SALT`가 없으면
#    워커가 모든 요청을 503으로 거부한다**(3단계 · 원천 fetch에 닿기 전이다).
#    그래서 "배포는 됐는데 아직 안 켠 상태"가 코드로 보장된다.
#    ⚠️ 그것은 사고를 줄이는 장치이지 승인을 대신하는 것이 아니다.

name = "deckbinder-image-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 도메인: workers.dev 서브도메인으로 시작한다 (2026-09-01 사용자 결정).
# ⚠️ 대가를 적어 둔다 — 나중에 커스텀 도메인으로 옮기면 **모든 이미지 URL이
#    바뀌고 콜로 캐시가 전량 무효가 된다.** 프록시 URL은 저장되지 않는
#    파생값이라(§9.4 ⓖ-5) DB 변경은 0건이지만, 캐시는 다시 채워진다.
workers_dev = true

[observability]
enabled = true

[vars]
# 🚨 비우면 decideHost()가 전부 거부한다 — 배포 단위 킬 스위치다 (§3.5).
#    "전부 허용"이 아니라 "전부 거부"인 것이 이 값의 핵심 성질이다.
IMAGE_PROXY_ALLOWED_HOSTS = "onepiece-cardgame.kr"

# 킬 스위치 플래그. 🚨 값 캐시가 아니라 플래그 하나다 — §3.5가 KV를 캐시
# 계층으로는 기각했지만(무료 1GB에 3,146장이 안 들어간다) 이 용도는 다르다.
# 환경변수로만 두면 끄는 데 배포가 필요해 "초 단위"가 깨진다.
[[kv_namespaces]]
binding = "KILL_SWITCH"
# 2026-09-01에 만들었다:  wrangler kv namespace create KILL_SWITCH
#
# ⚠️ 닭-달걀을 하나 겪었고 다음 사람을 위해 남긴다. id가 비어 있는 동안
#    wrangler는 **이 파일을 파싱하는 모든 명령**을 거부했다 — `deploy`뿐
#    아니라 `whoami`와 `kv namespace create`까지다. 즉 id를 얻으려는 명령이
#    id가 없어서 막혔다. 우회는 이 파일이 없는 디렉토리(저장소 루트)에서
#    wrangler를 직접 부르는 것이었다.
#    🚨 그때도 placeholder로 채우지 않았다 — 파싱이 되게 만드는 대가로
#    "배포 가능한 워커"를 트리에 세우는 것이 그 빈 문자열이 막던 것이다.
id = "5f3428dbc3414e1dbb2b82e9239dd328"

# 레이트리밋 겹 3 (§3.5). 🚨 2026-09-01 확정 — 무료 요금제에서 Durable Objects가
# 쓸 수 있는 것을 문서로 확인했고, §3.5의 사다리("DO 가용 → DO")가 첫 칸에서 섰다.
[[durable_objects.bindings]]
name = "IMAGE_RATE_COUNTER"
class_name = "ImageRateCounter"

# 🚨 `new_sqlite_classes`여야 한다. 무료 요금제는 **SQLite 백엔드 클래스만**
#    쓸 수 있고 key-value 백엔드는 유료다. `new_classes`로 적으면 무료
#    계정에서 배포가 거부된다 — 값이 아니라 가용성의 문제라 주석으로 남긴다.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImageRateCounter"]

# 시크릿 (wrangler secret put). 🚨 파일에 적지 않는다.
#   IMAGE_PROXY_IP_SALT — 겹 3의 IP 해시 솔트.
#   ⚠️ T2.9의 IP_HASH_SALT와 **다른 값**을 쓴다 (§9.2 ⓐ — 값을 나누는 비용은 0이다).
